# PLAN-41 D-A: SemVer version cut via release-please (manifest mode).
#
# On every push to main this maintains a release PR that accumulates
# conventional-commit history into a changelog and version bump; merging
# that PR creates the GitHub release + tag. The initial cut to 1.0.0 is
# forced by a "Release-As: 1.0.0" commit footer.
#
# Operator prerequisite (one-time, repo settings): Settings → Actions →
# General → "Allow GitHub Actions to create and approve pull requests".
#
# Downstream release jobs must chain off this job's `release_created`
# output — the default GITHUB_TOKEN does not fire tag-push workflows, and
# we keep the zero-PAT posture on purpose.

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # GHCR multi-arch publish rides the release event here (workflow_call)
  # because GITHUB_TOKEN-raised tag/release events never trigger
  # standalone workflows — zero-PAT posture, see docker-publish.yml.
  docker-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      # write: the final job attaches docker-compose.yml to the release.
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.release-please.outputs.version }}

  # PLAN-56 Phase 3a: signed per-platform tarballs + install.sh, attached to
  # the same release. Independent of the image publish; secrets: inherit
  # passes MINISIGN_SECRET_KEY to the approval-gated publish job.
  release-tarball:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release-tarball.yml
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.release-please.outputs.version }}

  # npm package: npm-publish.yml publishes with npm trusted publishing, which
  # trusts THAT workflow file, so it runs on its own rather than as a
  # workflow_call here. A workflow_dispatch is the one event the default
  # GITHUB_TOKEN may raise that starts another workflow; the publish itself
  # still waits for a maintainer's approval in the `npm` environment.
  npm-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch npm-publish.yml for the new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: gh workflow run npm-publish.yml --repo "${{ github.repository }}" --ref main -f tag="v$VERSION"
