name: Skills ablation

# PLAN-45 5.1 (D-6, I10): the skill ablation harness. The self-test runs
# every week and on demand with the deterministic oracle executor (no
# keys) and verifies the committed report against the corpus pin. The live
# run only exists when the repository has an ANTHROPIC_API_KEY secret; it
# opens a pull request with the dated report, never pushes to main.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: skills-ablation
  cancel-in-progress: false

jobs:
  selftest:
    name: Harness self-test (oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run benchmarks/skill-evolution/ablation.test.ts src/memory/skill-evolution/icl-context.test.ts
      - name: Oracle end to end (capped)
        run: pnpm benchmark:skills --executor oracle --arms none,harvested,evolved,in-context --corpora frozen,fresh --models primary --cap 6 --trials 3 --seed 1 --out /dev/null
      - name: Committed report matches the corpus pin (I10)
        run: pnpm benchmark:skills:check

  live:
    # Only meaningful when dispatched from a checkout that carries a node's
    # skills (BITTERBOT_STATE_DIR); a bare runner has no skill to measure and
    # the harness exits non-zero rather than publishing a baseline-only report.
    name: Live ablation (needs ANTHROPIC_API_KEY and a state dir)
    needs: selftest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BITTERBOT_STATE_DIR: ${{ runner.temp }}/bitterbot-state
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Skip without a key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; else echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - name: Run the capped suite on the primary and cheap models
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p "$BITTERBOT_STATE_DIR"
          pnpm benchmark:skills --arms none,harvested,evolved,in-context --corpora frozen,fresh --models primary,cheap --cap 6 --trials 3 --yes --out "docs/benchmarks/skills-$(date +%F).md"
          pnpm format:docs
      - name: Open a pull request with the report
        if: steps.key.outputs.present == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          branch: benchmarks/skills-ablation
          title: "docs(benchmarks): weekly skill ablation report"
          commit-message: "docs(benchmarks): skill ablation report"
          body: "Generated by the skills-ablation workflow (PLAN-45 5.1). Review the verdict sentences before merging."
          add-paths: docs/benchmarks/*
