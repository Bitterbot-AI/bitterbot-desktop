name: Orchestrator Release

# Tag-triggered build + publish of prebuilt bitterbot-orchestrator binaries
# for the 5 supported platforms. Bump orchestrator/Cargo.toml version, commit,
# and push a matching `orchestrator-v<version>` tag to run this workflow.

on:
  push:
    tags:
      - "orchestrator-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. orchestrator-v0.1.0). Must already exist."
        required: true
        type: string

concurrency:
  group: orchestrator-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # required by softprops/action-gh-release to publish
  id-token: write # build-provenance attestation (Sigstore)
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            bin: bitterbot-orchestrator
            asset: bitterbot-orchestrator-linux-x64
          - target: linux-arm64
            os: ubuntu-22.04-arm
            rust-target: aarch64-unknown-linux-gnu
            bin: bitterbot-orchestrator
            asset: bitterbot-orchestrator-linux-arm64
          - target: darwin-x64
            os: macos-14
            rust-target: x86_64-apple-darwin
            bin: bitterbot-orchestrator
            asset: bitterbot-orchestrator-darwin-x64
          - target: darwin-arm64
            os: macos-14
            rust-target: aarch64-apple-darwin
            bin: bitterbot-orchestrator
            asset: bitterbot-orchestrator-darwin-arm64
          - target: win32-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bin: bitterbot-orchestrator.exe
            asset: bitterbot-orchestrator-win32-x64.exe

    steps:
      # Third-party actions are SHA-pinned (security pass C1): a moved tag can
      # no longer swap the action out from under a signed-release build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: orchestrator
          shared-key: ${{ matrix.target }}

      - name: Build release
        working-directory: orchestrator
        env:
          RUSTFLAGS: "-C strip=symbols"
        run: cargo build --release --target ${{ matrix.rust-target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p staging
          cp "orchestrator/target/${{ matrix.rust-target }}/release/${{ matrix.bin }}" "staging/${{ matrix.asset }}"
          ls -lh staging/

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: staging/${{ matrix.asset }}
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Approval gate (security pass tag-push vector): publishing runs in a
    # protected Environment whose required reviewer must approve before the
    # job proceeds. A malicious pushed tag builds but CANNOT be signed or
    # published without that approval. Configure once in repo Settings →
    # Environments → "release" (required reviewers = the maintainer).
    environment: release

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Extract version for notes
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#orchestrator-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Flatten, checksum, and SIGN
        working-directory: .
        env:
          # minisign secret key (unencrypted, `minisign -G -W`). Stored as a
          # repo secret; only reachable inside this approval-gated job.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY secret is not set — refusing to publish an unsigned release" >&2
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          mkdir -p release
          find artifacts -type f -name 'bitterbot-orchestrator-*' -exec cp {} release/ \;
          cd release
          sha256sum bitterbot-orchestrator-* > checksums.txt
          cat checksums.txt
          # Sign checksums.txt; the signed trusted comment names the tag, which
          # the relay updater asserts to prevent cross-release replay.
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/relay.key"
          minisign -S -s "$RUNNER_TEMP/relay.key" -m checksums.txt \
            -t "${{ steps.meta.outputs.tag }} checksums" \
            -c "bitterbot orchestrator release"
          rm -f "$RUNNER_TEMP/relay.key"
          # Optional self-verify: if the public key is also provided as a
          # secret, confirm the pair matches before publishing (catches a
          # mismatched keypair early). Not required — the relay-side verify
          # against the embedded key is the real gate.
          PUB='${{ secrets.MINISIGN_PUBLIC_KEY }}'
          if [ -n "$PUB" ]; then
            minisign -V -P "$PUB" -m checksums.txt || {
              echo "::error::self-verify failed — MINISIGN_PUBLIC_KEY does not match the signing key" >&2
              exit 1; }
          fi
          ls -lh

      # Provenance attestation for every binary (PLAN-41): zero secrets,
      # verify with `gh attestation verify <file> --repo Bitterbot-AI/bitterbot-desktop`.
      # minisign stays the updater-path signer; attestations are the
      # supply-chain audit trail (Sigstore underneath).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/bitterbot-orchestrator-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Orchestrator ${{ steps.meta.outputs.version }}
          files: |
            release/bitterbot-orchestrator-*
            release/checksums.txt
            release/checksums.txt.minisig
          fail_on_unmatched_files: true
          # Generated notes carry the commit-range changelog; the body
          # below keeps the verification instructions (PLAN-41: no more
          # hardcoded "Automated release" note).
          generate_release_notes: true
          body: |
            Prebuilt `bitterbot-orchestrator` v${{ steps.meta.outputs.version }} binaries.

            Downloaded automatically by `pnpm install` via `scripts/fetch-orchestrator.mjs`.
            `checksums.txt` is minisign-signed (`checksums.txt.minisig`); the
            relay fleet verifies it against an embedded public key before
            installing. Manual verification:
            `minisign -Vm checksums.txt -P <fleet pubkey>` then `sha256sum -c checksums.txt`.
