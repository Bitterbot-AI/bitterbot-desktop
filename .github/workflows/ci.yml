name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (root)
        run: npx tsc --noEmit

      - name: Type check (desktop renderer)
        run: pnpm --filter bitterbot-control-ui typecheck

      - name: Build
        if: runner.os != 'Windows'
        run: pnpm build

      # Production build of the Control UI. Typecheck alone (above) does not
      # catch bundler-time failures — those only surfaced at Railway deploy
      # time before this step existed. Matches the Railway image's UI build.
      - name: Build (desktop renderer)
        if: runner.os != 'Windows'
        run: pnpm --filter bitterbot-control-ui build

      # Pack-content gate (PLAN-41 npm-pack-leak): a dry-run `npm pack`
      # must contain no internal docs, no databases/keys, and stay under
      # the size ceiling. Runs after the build so dist/ is real.
      - name: Pack-content gate (release:check)
        if: runner.os != 'Windows'
        run: pnpm release:check

      - name: Unit tests
        run: pnpm test:fast

      # The gateway suite (src/gateway/**, 635 tests) is EXCLUDED from the unit
      # config, and until 2026-08-26 no workflow ran it at all — every gateway
      # test, including the Control-UI serving and token-handoff ones, guarded
      # nothing. Ubuntu-only to start: the suite has never run on macOS or
      # Windows runners, so broadening is a deliberate follow-up, not a default.
      - name: Gateway tests
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:gateway

  docker:
    # Verifies V1 audit blocker 4: this Dockerfile could not build from the
    # initial commit until 2026-08-26 and had zero CI coverage, which is how it
    # stayed broken. The smoke test proves the built image actually boots the
    # gateway and serves the Control UI, not merely that the layers assemble.
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t bitterbot:ci .

      - name: Smoke test — gateway boots and serves the Control UI
        run: |
          docker run -d --name bb -p 19001:19001             -e BITTERBOT_GATEWAY_TOKEN=ci-smoke-token             bitterbot:ci             node bitterbot.mjs gateway --allow-unconfigured --bind lan
          code=000
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}'               -H "Authorization: Bearer ci-smoke-token"               http://127.0.0.1:19001/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "GET / -> $code"
          docker logs bb 2>&1 | tail -30
          [ "$code" = "200" ]

  orchestrator-check:
    # Cargo PRs were previously "green" because nothing in CI compiled the
    # Rust tree — the only cargo touchpoint was the non-blocking audit. A
    # plain `cargo check --locked` is the cheapest gate that catches API
    # breaks from dependency bumps (e.g. sha2 0.10->0.11, base64 0.22->0.23).
    name: Orchestrator (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            orchestrator/target
          key: cargo-check-${{ runner.os }}-${{ hashFiles('orchestrator/Cargo.lock') }}
          restore-keys: cargo-check-${{ runner.os }}-

      - name: cargo check
        run: cargo check --locked --manifest-path orchestrator/Cargo.toml

  audit:
    # PLAN-41 Phase 1 (p0-11): dependency-advisory visibility. Non-blocking by
    # design — continue-on-error keeps a fresh advisory from redding the build,
    # while the log still surfaces what needs attention.
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm audit (workspace lockfile covers root + desktop)
        run: pnpm audit --prod || true

      - name: cargo audit (orchestrator)
        run: |
          cargo install cargo-audit --locked || true
          (cd orchestrator && cargo audit) || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Docs check (format + markdownlint + link audit)
        run: pnpm check:docs
