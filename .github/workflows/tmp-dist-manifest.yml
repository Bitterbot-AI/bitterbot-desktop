# TEMPORARY (PR #122 verification): builds dist/ on main and on the PR head
# and prints a manifest for an old-vs-new comparison. Remove before merge.
name: TMP dist manifest

on:
  pull_request:
    branches: [main]

jobs:
  manifest:
    name: dist manifest (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: old
            ref: 55be0ba27af3061657ace1cd97dc06756b0b43b6
          - label: new
            ref: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsdown only (timed)
        run: |
          node -e "require('node:fs').rmSync('dist',{recursive:true,force:true})"
          /usr/bin/time -v pnpm exec tsdown 2> time.txt; tail -n 30 time.txt | grep -E "Maximum resident|Elapsed|Exit status"
      - name: full build (timed)
        run: |
          /usr/bin/time -v pnpm build 2> time.txt || (tail -50 time.txt; exit 1)
          grep -E "Maximum resident|Elapsed|Exit status" time.txt
      - name: manifest
        run: |
          cat > "$RUNNER_TEMP/manifest.mjs" <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import { createRequire } from "node:module";
          import { execFileSync } from "node:child_process";
          const require = createRequire(path.resolve("package.json"));
          const ts = require("typescript");
          const out = [];
          const P = (s) => out.push(s);
          const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => {
            const p = path.join(d, e.name);
            return e.isDirectory() ? walk(p) : [p];
          });
          const all = walk("dist").sort();
          const isUi = (f) => f.startsWith("dist/control-ui/");
          const ui = all.filter(isUi);
          P(`UI files=${ui.length} bytes=${ui.reduce((a, f) => a + fs.statSync(f).size, 0)}`);
          const rest = all.filter((f) => !isUi(f));
          let total = 0;
          for (const f of rest) { const s = fs.statSync(f).size; total += s; P(`FILE ${f} ${s}`); }
          const js = rest.filter((f) => /\.(m?js)$/.test(f));
          const tsdownJs = js.filter((f) => f !== "dist/entry.js");
          P(`TOTAL nonui files=${rest.length} bytes=${total} js=${js.length}`);
          P(`TSDOWN js files=${tsdownJs.length} bytes=${tsdownJs.reduce((a, f) => a + fs.statSync(f).size, 0)}`);
          const staticExports = (f) => {
            const sf = ts.createSourceFile(f, fs.readFileSync(f, "utf8"), ts.ScriptTarget.Latest, true, ts.ScriptKind.JS);
            const names = [];
            for (const st of sf.statements) {
              if (ts.isExportDeclaration(st)) {
                if (st.exportClause && ts.isNamedExports(st.exportClause)) for (const el of st.exportClause.elements) names.push(el.name.text);
                else names.push(`*from:${st.moduleSpecifier?.text}`);
              } else if (ts.isExportAssignment(st)) names.push("default");
              else if (st.modifiers?.some((m) => m.kind === ts.SyntaxKind.ExportKeyword)) {
                if (ts.isVariableStatement(st)) for (const d of st.declarationList.declarations) names.push(d.name.getText());
                else if (st.name) names.push(st.modifiers.some((m) => m.kind === ts.SyntaxKind.DefaultKeyword) ? "default" : st.name.text);
              }
            }
            return names.sort();
          };
          const bare = (f) => {
            const src = fs.readFileSync(f, "utf8");
            const set = new Set();
            for (const m of src.matchAll(/(?:\bfrom\s*|\bimport\s*\(\s*|\bimport\s+|\brequire\s*\(\s*)["']([^"'./][^"']*)["']/g)) {
              const s = m[1];
              if (s.startsWith("node:")) continue;
              set.add(s);
            }
            return set;
          };
          const entries = ["dist/index.js", "dist/entry.js", "dist/daemon-cli.js", "dist/warning-filter.js", "dist/extensionAPI.js", "dist/plugin-sdk/index.js", "dist/plugin-sdk/account-id.js", "dist/llm-slug-generator.js", ...rest.filter((f) => f.endsWith("/handler.js"))];
          for (const e of [...new Set(entries)]) {
            if (!fs.existsSync(e)) { P(`ENTRY ${e} MISSING`); continue; }
            P(`ENTRY ${e} static=${staticExports(e).join(",")}`);
            if (e === "dist/entry.js") continue;
            try {
              const keys = execFileSync(process.execPath, ["-e", `import(${JSON.stringify("./" + e)}).then(m=>{console.log(Object.keys(m).sort().join(","));process.exit(0)}).catch(err=>{console.log("IMPORT_ERR "+err.message);process.exit(0)})`], { encoding: "utf8", timeout: 60000, env: { ...process.env, HOME: fs.mkdtempSync("/tmp/h-") }, stdio: ["ignore", "pipe", "ignore"] }).trim().split("\n").at(-1);
              P(`ENTRY ${e} runtime=${keys}`);
            } catch (err) { P(`ENTRY ${e} runtime=ERR ${err.message.split("\n")[0]}`); }
          }
          const ext = new Set();
          for (const f of tsdownJs) for (const s of bare(f)) ext.add(s);
          P(`TSDOWN_EXTERNALS ${[...ext].sort().join(" ")}`);
          P(`ENTRYJS_EXTERNALS ${[...bare("dist/entry.js")].sort().join(" ")}`);
          let nm = 0; const nmFiles = new Set();
          for (const f of tsdownJs) { const c = (fs.readFileSync(f, "utf8").match(/^\/\/#region .*node_modules\//gm) || []).length; if (c) { nm += c; nmFiles.add(f); } }
          P(`TSDOWN_NODE_MODULES_REGIONS ${nm} files=${[...nmFiles].join(",")}`);
          for (const native of ["sqlite-vec", "better-sqlite3", "sharp", "playwright", "playwright-core", "@napi-rs/canvas", "node-llama-cpp"]) {
            const inlined = tsdownJs.filter((f) => fs.readFileSync(f, "utf8").includes(`//#region node_modules/.pnpm/${native.replace("/", "+")}@`));
            P(`NATIVE ${native} inlined_in=${inlined.length}`);
          }
          P(`DTS plugin-sdk ${rest.filter((f) => f.startsWith("dist/plugin-sdk/") && f.endsWith(".d.ts")).length} files`);
          P(`DTS outside plugin-sdk ${rest.filter((f) => !f.startsWith("dist/plugin-sdk/") && /\.d\.(m?ts)$/.test(f)).length}`);
          P(`SHEBANG index.js=${fs.readFileSync("dist/index.js", "utf8").startsWith("#!")} entry.js=${fs.readFileSync("dist/entry.js", "utf8").startsWith("#!")}`);
          console.log(out.map((l) => "MANIFEST| " + l).join("\n"));
          JS
          node "$RUNNER_TEMP/manifest.mjs"
          git status --porcelain | head -20
