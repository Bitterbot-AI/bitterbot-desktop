# Publish the `bitterbot` package to npm (npm trusted publishing, OIDC).
#
# Triggers:
#   - release: published   a release published by hand (vX.Y.Z tags only)
#   - workflow_dispatch     tag input, e.g. v1.6.0: publish an existing
#                           release. release-please.yml dispatches this for
#                           every release it creates (a release created with
#                           the default GITHUB_TOKEN never fires `release`
#                           events; workflow_dispatch is the exception, and it
#                           keeps this file as the OIDC workflow npm trusts).
#
# No NPM_TOKEN exists anywhere: npm trusts this workflow file
# (npm-publish.yml) in Bitterbot-AI/bitterbot-desktop running in the `npm`
# environment, and the environment requires a maintainer's approval before
# the publish job starts. Setup: docs/reference/npm-publishing.md.
#
# The publish job checks out the TAG, so the package is built from the
# released code, then: version == tag, already on npm -> skip cleanly,
# pnpm build, scripts/npm-package.ts prepare (optional native peers,
# npm-shrinkwrap.json with the security overrides), release:check
# --npm-publish, npm publish --provenance --access public.

name: npm-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v1.6.0"
        required: true
        type: string

concurrency:
  group: npm-publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance (Sigstore)
    steps:
      - name: Resolve the tag
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$RELEASE_TAG}"
          # Release events also fire for orchestrator-v* and desktop-v*
          # releases: only app tags vX.Y.Z publish.
          case "$tag" in
            v[0-9]*) ;;
            [0-9]*) tag="v$tag" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"; echo "not an app release: $tag"; exit 0 ;;
          esac
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must be vX.Y.Z, got '$tag'"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - if: steps.v.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.v.outputs.tag }}

      - name: Version matches the tag
        if: steps.v.outputs.run == 'true'
        run: |
          set -euo pipefail
          pkg=$(node -p 'require("./package.json").version')
          if [ "$pkg" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::package.json is $pkg but the tag is ${{ steps.v.outputs.tag }}"; exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.v.outputs.run == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI 11.5.1 or later; Node 22 ships 10.x.
      - name: Upgrade npm
        if: steps.v.outputs.run == 'true'
        run: |
          npm install -g npm@11
          node -e '
            const [a, b, c] = process.argv[1].trim().split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              throw new Error("npm " + process.argv[1].trim() + " is older than 11.5.1");
            }
            console.log("npm " + process.argv[1].trim());
          ' "$(npm --version)"

      - name: Skip when this version is already on npm
        id: exists
        if: steps.v.outputs.run == 'true'
        run: |
          set -euo pipefail
          if npm view "bitterbot@${{ steps.v.outputs.version }}" version > /dev/null 2>&1; then
            echo "bitterbot@${{ steps.v.outputs.version }} is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.v.outputs.run == 'true' && steps.exists.outputs.published == 'false'

      # No dependency cache in a release build (a poisoned cache must not
      # reach a published artifact).
      - name: Install dependencies
        if: steps.v.outputs.run == 'true' && steps.exists.outputs.published == 'false'
        env:
          BITTERBOT_SKIP_ORCHESTRATOR_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.v.outputs.run == 'true' && steps.exists.outputs.published == 'false'
        run: pnpm build

      - name: Prepare the npm package and run the pack gate
        if: steps.v.outputs.run == 'true' && steps.exists.outputs.published == 'false'
        run: |
          set -euo pipefail
          node --import tsx scripts/npm-package.ts prepare
          pnpm release:check --npm-publish

      - name: npm publish (trusted publishing, provenance)
        if: steps.v.outputs.run == 'true' && steps.exists.outputs.published == 'false'
        # --ignore-scripts: prepack would rebuild; the build above is the one
        # the gate checked. Consumers' install hooks are unaffected.
        run: npm publish --provenance --access public --ignore-scripts

      - name: Confirm the registry serves it
        if: steps.v.outputs.run == 'true' && steps.exists.outputs.published == 'false'
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if [ "$(npm view "bitterbot@${{ steps.v.outputs.version }}" version 2>/dev/null)" = "${{ steps.v.outputs.version }}" ]; then
              echo "bitterbot@${{ steps.v.outputs.version }} is live on npm"; exit 0
            fi
            sleep 10
          done
          echo "::error::published, but the registry does not serve ${{ steps.v.outputs.version }} yet"; exit 1
