# Publish the `bitterbot` package to npm (npm trusted publishing, OIDC).
#
# The npm package is a small launcher (scripts/npm-package.ts, src/launcher/):
# no dependencies, no install scripts. On first run it downloads and verifies
# this release's signed per-platform tarball from GitHub Releases. So a
# version may only reach npm once those assets are PUBLIC: the `assets` job
# below waits until every platform's tarball, checksums.txt and its .minisig
# answer on the public download URLs the launcher uses (draft releases do
# not), before the approval-gated publish job can start.
#
# Triggers:
#   - release: published   a release published by hand (vX.Y.Z tags only)
#   - workflow_dispatch     tag input, e.g. v1.6.2: publish an existing
#                           release. release-please.yml dispatches this after
#                           its release-tarball job has uploaded and
#                           published the assets (a release created with the
#                           default GITHUB_TOKEN never fires `release`
#                           events; workflow_dispatch is the exception, and it
#                           keeps this file as the OIDC workflow npm trusts).
#
# No NPM_TOKEN exists anywhere: npm trusts this workflow file
# (npm-publish.yml) in Bitterbot-AI/bitterbot-desktop running in the `npm`
# environment, and the environment requires a maintainer's approval before
# the publish job starts. Setup: docs/reference/npm-publishing.md.
#
# The publish job checks out the TAG, so the launcher is built from the
# released code, then: version == tag, already on npm -> skip cleanly,
# scripts/npm-package.ts prepare --out (bundle the launcher, compat shims,
# the dependency-free manifest), release:check --npm-publish --dir (exact
# file list, no dependencies, no scripts, only node: imports), npm publish
# --provenance --access public from that directory.

name: npm-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v1.6.0"
        required: true
        type: string

concurrency:
  group: npm-publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assets:
    name: Release assets are public
    runs-on: ubuntu-latest
    # A forced rebuild or a hand-published release can still be building:
    # wait up to two hours (release-tarball.yml builds take about 45 minutes
    # plus the signing approval).
    timeout-minutes: 130
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      run: ${{ steps.v.outputs.run }}
    steps:
      - name: Resolve the tag
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$RELEASE_TAG}"
          # Release events also fire for orchestrator-v* and desktop-v*
          # releases: only app tags vX.Y.Z publish.
          case "$tag" in
            v[0-9]*) ;;
            [0-9]*) tag="v$tag" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"; echo "not an app release: $tag"; exit 0 ;;
          esac
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must be vX.Y.Z, got '$tag'"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - if: steps.v.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.v.outputs.tag }}

      - name: Wait for every platform's signed tarball on the public download URLs
        if: steps.v.outputs.run == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The core platforms only: an optional one (darwin-x64 for now) may
          # be missing from a release, and the launcher reports that as
          # unavailable on that platform.
          platforms=$(node --input-type=module -e "const m = await import('file://$GITHUB_WORKSPACE/scripts/release-tarball-lib.mjs'); console.log(Object.entries(m.RELEASE_PLATFORMS).filter(([, p]) => !p.optional).map(([id]) => id).join(' '))")
          base="https://github.com/$REPO/releases/download/v$VERSION"
          assets="checksums.txt checksums.txt.minisig"
          for p in $platforms; do assets="$assets bitterbot-$VERSION-$p.tar.gz"; done
          echo "waiting for: $assets"
          for i in $(seq 1 120); do
            missing=""
            for a in $assets; do
              curl -fsSIL -o /dev/null "$base/$a" || missing="$missing $a"
            done
            if [ -z "$missing" ]; then
              echo "every asset of v$VERSION is public"; exit 0
            fi
            echo "not public yet:$missing (check $i/120); waiting 60s"
            sleep 60
          done
          echo "::error::v$VERSION is missing$missing after two hours. The npm launcher downloads these, so it is not published before them. Re-run this workflow once release-tarball.yml has published the release."
          exit 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.v.outputs.run == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.v.outputs.run == 'true'
        with:
          node-version: 22

      - name: Install the launcher build tools
        if: steps.v.outputs.run == 'true'
        env:
          BITTERBOT_SKIP_ORCHESTRATOR_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      # The real thing, before anyone is asked to approve a publish: the
      # launcher built from this tag installs the PUBLIC release for
      # linux-x64 with the pinned key (production mode, no overrides) and
      # runs it.
      - name: The launcher installs and runs the public release (production mode)
        if: steps.v.outputs.run == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          node --import tsx scripts/npm-package.ts prepare --out "$RUNNER_TEMP/npm-package"
          export HOME="$RUNNER_TEMP/launcher-home" && mkdir -p "$HOME"
          v=$(node "$RUNNER_TEMP/npm-package/bitterbot.mjs" --version | tail -1)
          echo "bitterbot --version -> $v"
          echo "$v" | grep -qw "$VERSION"
          [ "$(readlink "$HOME/.bitterbot/app/current")" = "$VERSION" ]

  publish:
    name: Publish to npm
    needs: assets
    if: needs.assets.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance (Sigstore)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.assets.outputs.tag }}

      - name: Version matches the tag
        run: |
          set -euo pipefail
          pkg=$(node -p 'require("./package.json").version')
          if [ "$pkg" != "${{ needs.assets.outputs.version }}" ]; then
            echo "::error::package.json is $pkg but the tag is ${{ needs.assets.outputs.tag }}"; exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI 11.5.1 or later; Node 22 ships 10.x.
      - name: Upgrade npm
        run: |
          npm install -g npm@11
          node -e '
            const [a, b, c] = process.argv[1].trim().split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              throw new Error("npm " + process.argv[1].trim() + " is older than 11.5.1");
            }
            console.log("npm " + process.argv[1].trim());
          ' "$(npm --version)"

      - name: Skip when this version is already on npm
        id: exists
        run: |
          set -euo pipefail
          if npm view "bitterbot@${{ needs.assets.outputs.version }}" version > /dev/null 2>&1; then
            echo "bitterbot@${{ needs.assets.outputs.version }} is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.exists.outputs.published == 'false'

      # Only for the launcher build tools (esbuild, tsx). No dependency cache
      # in a release build (a poisoned cache must not reach a published
      # artifact), and no app build: the app ships in the release tarball.
      - name: Install dependencies
        if: steps.exists.outputs.published == 'false'
        env:
          BITTERBOT_SKIP_ORCHESTRATOR_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Build the launcher package and run the pack gate
        if: steps.exists.outputs.published == 'false'
        run: |
          set -euo pipefail
          node --import tsx scripts/npm-package.ts prepare --out "$RUNNER_TEMP/npm-package"
          pnpm release:check --npm-publish --dir "$RUNNER_TEMP/npm-package"
          cat "$RUNNER_TEMP/npm-package/package.json"

      - name: npm publish (trusted publishing, provenance)
        if: steps.exists.outputs.published == 'false'
        # The package has no scripts at all; --ignore-scripts keeps it that
        # way even if one slipped past the gate.
        working-directory: ${{ runner.temp }}/npm-package
        run: npm publish --provenance --access public --ignore-scripts

      - name: Confirm the registry serves it
        if: steps.exists.outputs.published == 'false'
        # The launcher is a few dozen KB, so npm usually serves it within a
        # minute or two. Poll every 30s for up to 15 minutes before calling it
        # a failure.
        timeout-minutes: 20
        env:
          VERSION: ${{ needs.assets.outputs.version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if [ "$(npm view "bitterbot@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "bitterbot@$VERSION is live on npm (after about $(( (i - 1) * 30 / 60 )) min)"; exit 0
            fi
            echo "registry does not serve bitterbot@$VERSION yet (check $i/30); waiting 30s"
            sleep 30
          done
          echo "::error::npm publish succeeded, but after 15 minutes the registry still does not serve bitterbot@$VERSION. The publish call itself succeeded, so do not publish again: check npm view bitterbot@$VERSION version later. Once it answers, a re-run skips the publish (the version exists) and passes."
          exit 1
