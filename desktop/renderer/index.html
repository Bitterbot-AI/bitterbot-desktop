<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      img-src deliberately has NO `https://*` wildcard (removed 2026-07-27).
      A remote <img> is a tracking pixel: it beacons the viewer's IP and a
      precise read-timestamp to whoever chose the URL. With the wildcard, any
      peer-supplied or agent-supplied URL that reached an <img> did exactly
      that, with no attacker code required. Remote image URLs now render as an
      explicit click-to-open link instead (MessageBubble), so leaking your IP
      is a choice the human makes rather than a side effect of scrolling.
      The two google entries stay ONLY for the existing favicon service in the
      browser tool view (tool-view-utils.ts); nothing peer-facing may use them.
      Anything that needs to display remote bytes must proxy them through the
      loopback gateway, which is already allowed here.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; frame-src 'self' http://localhost:* http://127.0.0.1:*; img-src 'self' data: http://localhost:* http://127.0.0.1:* https://www.google.com https://*.googleapis.com"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/geist@1/dist/fonts/geist-sans/style.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/geist@1/dist/fonts/geist-mono/style.css"
    />
    <title>Bitterbot</title>
  </head>
  <body class="bitterbot-theme">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
