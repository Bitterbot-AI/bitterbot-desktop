<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      img-src deliberately has NO `https://*` wildcard (removed 2026-07-27).
      A remote <img> is a tracking pixel: it beacons the viewer's IP and a
      precise read-timestamp to whoever chose the URL. With the wildcard, any
      peer-supplied or agent-supplied URL that reached an <img> did exactly
      that, with no attacker code required. Remote image URLs now render as an
      explicit click-to-open link instead (MessageBubble), so leaking your IP
      is a choice the human makes rather than a side effect of scrolling.
      The two google entries stay ONLY for the existing favicon service in the
      browser tool view (tool-view-utils.ts); nothing peer-facing may use them.
      Anything that needs to display remote bytes must proxy them through the
      loopback gateway, which is already allowed here.
    -->
    <!--
      Fonts are self-hosted (public/fonts, SIL OFL 1.1, license alongside).
      The old cdn.jsdelivr.net stylesheet URLs had returned 404 since the day
      they were added — the UI silently ran on system-font fallback while
      making two dead requests plus a preconnect per load — and a CDN font is
      an availability + privacy dependency this UI does not need. With them
      gone, the CSP drops jsdelivr entirely and the UI is fully offline-capable.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; frame-src 'self' http://localhost:* http://127.0.0.1:*; img-src 'self' data: http://localhost:* http://127.0.0.1:* https://www.google.com https://*.googleapis.com"
    />
    <style>
      @font-face {
        font-family: "Geist";
        src: url("/fonts/Geist-Variable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("/fonts/GeistMono-Variable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <title>Bitterbot</title>
  </head>
  <body class="bitterbot-theme">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
